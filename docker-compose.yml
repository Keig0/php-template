services:
  php:
    build: ./docker/php
    ports: [ "8080:80" ]
    volumes:
      - ./htdocs:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/php.ini:ro
    depends_on: [ "db" ]
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME:-app}
      DB_USER: ${DB_USER:-app}
      DB_PASSWORD: ${DB_PASSWORD:-app}

  db:
    image: mysql:8.4
    container_name: my_project_mysql
    volumes:
      - ./db/mysql_data:/var/lib/mysql
      - ./db/my.cnf:/etc/mysql/conf.d/my.cnf:ro
      - ./db/init:/docker-entrypoint-initdb.d:ro
    restart: always
    environment:
      TZ: Asia/Tokyo
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: ${DB_NAME:-app}
      MYSQL_USER: ${DB_USER:-app}
      MYSQL_PASSWORD: ${DB_PASSWORD:-app}

  phpmyadmin:
    image: phpmyadmin:5.2
    ports: [ "8081:80" ]
    depends_on: [ "db" ]
    environment:
      PMA_HOST: db

volumes:
  db_data:
